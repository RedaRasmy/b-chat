name: Playwright
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: mydb
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install dependencies
              run: npm install -g pnpm && pnpm install

            - name: Build
              run: pnpm build

            - name: Install Playwright Browsers
              run: pnpm ete:install-deps

            - name: Push database tables
              run: pnpm db:push
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mydb


            - name: Run Playwright tests
              run: pnpm ete
              env:
                  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/mydb
                  JWT_ACCESS_SECRET: dsjkfjaklsjdkfjaksdjkfjaksdkfjaskfjkasjdkf
                  FRONTEND_URL: http://localhost:5173
                  VITE_API_URL: http://localhost:3000

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: packages/playwright/playwright-report/
                  retention-days: 30
