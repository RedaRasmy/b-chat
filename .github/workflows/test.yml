name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*

            - name: Install dependencies
              working-directory: .
              run: npm install -g pnpm && pnpm install

            - name: Run Tests
              run: pnpm test

              env:
                  VITE_API_URL: http://localhost:3000
